<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Workvaro</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Workvaro: leave, attendance and people management for your company.">
  <meta name="theme-color" content="#16402F">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Apply the saved or system theme before first paint (ThemeService takes over afterwards)
    (function () {
      var t = null;
      try { t = localStorage.getItem('wv-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
