# Production stack for one VPS (4-8 GB RAM). Only Caddy is published (ports 80/443);
# everything else lives on the private Docker network.
#   cp infra/.env.prod.example infra/.env   # fill in real values
#   node infra/scripts/make-prod-realm.mjs   # once, creates infra/keycloak/prod/realm-ems.json
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env up -d --build
name: ems-prod

x-service: &service
  restart: unless-stopped
  build:
    context: ..
    dockerfile: Dockerfile
  networks: [backend]

x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: prod
  KEYCLOAK_ISSUER_URI: https://${AUTH_DOMAIN}/realms/ems
  EMS_ZONE_ID: ${EMS_ZONE_ID:-Asia/Kolkata}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: https://${AUTH_DOMAIN:?set AUTH_DOMAIN}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/prod/realm-ems.json:/opt/keycloak/data/import/realm-ems.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  employee-service:
    <<: *service
    build:
      context: ..
      dockerfile: Dockerfile
      args: { MODULE: employee-service }
    environment:
      <<: *service-env
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      EMS_ENCRYPTION_KEY: ${EMS_ENCRYPTION_KEY:?set EMS_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  leave-attendance-service:
    <<: *service
    build:
      context: ..
      dockerfile: Dockerfile
      args: { MODULE: leave-attendance-service }
    environment:
      <<: *service-env
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      EMPLOYEE_SERVICE_URL: http://employee-service:8081
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    <<: *service
    build:
      context: ..
      dockerfile: Dockerfile
      args: { MODULE: api-gateway }
    environment:
      <<: *service-env
      EMPLOYEE_SERVICE_URL: http://employee-service:8081
      LEAVE_SERVICE_URL: http://leave-attendance-service:8082
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
    depends_on: [employee-service, leave-attendance-service]

  web:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        AUTH_DOMAIN: ${AUTH_DOMAIN}
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api-gateway, keycloak]
    networks:
      backend:
        # Services validate tokens against https://AUTH_DOMAIN; this alias keeps that traffic inside the VPS
        aliases:
          - ${AUTH_DOMAIN}

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  backend:
